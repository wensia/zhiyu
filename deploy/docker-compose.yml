services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: zhiyu:latest
    container_name: zhiyu
    restart: unless-stopped
    environment:
      APP_ENV: self-host
      BIND_ADDR: 0.0.0.0:8790
      PUBLIC_BASE_URL: https://zhiyu.askfish.net
      DATABASE_URL: file:/data/preview.db
      DEV_MAIL_DIR: /data/dev-mail
      WEB_DIST_DIR: /app/web
      RUST_LOG: zhiyu_api=info,tower_http=info
    volumes:
      - /opt/zhiyu/data:/data
    expose:
      - "8790"
    networks:
      - ai-ditui

networks:
  ai-ditui:
    external: true
    name: ai-ditui_default
