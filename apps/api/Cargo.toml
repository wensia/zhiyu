[package]
name = "zhiyu-api"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "zhiyu_api"
path = "src/lib.rs"

[[bin]]
name = "zhiyu-api"
path = "src/main.rs"

[[bin]]
name = "zhiyu-api-key"
path = "src/bin/api_key.rs"

[[bin]]
name = "zhiyu-passwd"
path = "src/bin/passwd.rs"

[[bin]]
name = "zhiyu-recategorize"
path = "src/bin/recategorize.rs"

[[bin]]
name = "zhiyu-renormalize"
path = "src/bin/renormalize.rs"

[[bin]]
name = "zhiyu-reself"
path = "src/bin/reself.rs"

[dependencies]
anyhow.workspace = true
argon2.workspace = true
async-trait.workspace = true
axum = { workspace = true, features = ["multipart"] }
base64.workspace = true
calamine.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
dotenvy.workspace = true
encoding_rs.workspace = true
csv.workspace = true
libsql.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tower.workspace = true
tower-http.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
utoipa.workspace = true
uuid.workspace = true
zhiyu-backup-policy.workspace = true

[dev-dependencies]
tempfile = "3.23"
