[package]
name = "zhiyu-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "zhiyu_desktop"
# Tauri 在移动端需要 staticlib/cdylib；桌面端走 rlib。
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "zhiyu-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tracing-subscriber.workspace = true
tracing.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
reqwest.workspace = true
keyring.workspace = true
zhiyu-backup-policy.workspace = true

# 交通灯的尺寸没有 Tauri API，只能直接摸 AppKit 的窗口按钮。这几个 crate 已经在
# tao/wry 的依赖树里，显式声明只是为了能自己调用。
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSButton",
  "NSControl",
  "NSResponder",
  "NSView",
  "NSWindow",
  "objc2-quartz-core",
] }
objc2-quartz-core = { version = "0.3", default-features = false, features = [
  "std",
  "CALayer",
  "CATransform3D",
  "objc2-core-foundation",
] }
