<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>连接设置</title>
    <link rel="stylesheet" href="settings.css" />
    <script src="settings.js" defer></script>
  </head>
  <body>
    <main>
      <div class="page-head">
        <p class="eyebrow">知余桌面版</p>
        <h1>连接设置</h1>
        <p class="intro">
          桌面版通过服务器地址与 api-key 连接你的自部署实例，连接后直接可用，不需要邮箱登录。
        </p>
      </div>

      <div class="settings-grid">
      <form class="card" id="settings-form" novalidate>
        <div class="card-head">
          <h2>服务器</h2>
          <span class="badge pending" id="connection-badge">未连接</span>
        </div>

        <div class="field">
          <label for="server-url">服务器地址</label>
          <input
            id="server-url"
            name="serverUrl"
            type="url"
            required
            autocomplete="url"
            spellcheck="false"
            placeholder="https://ledger.example.com"
          />
          <p class="hint">需填写完整地址。生产环境必须用 HTTPS，本地开发可用 http://127.0.0.1:端口。</p>
        </div>

        <div class="field">
          <label for="api-key">api-key</label>
          <div class="field-with-action">
            <input
              id="api-key"
              name="apiKey"
              type="password"
              autocomplete="off"
              spellcheck="false"
              placeholder="粘贴 api-key"
            />
            <button class="field-action" id="toggle-key" type="button" aria-label="显示 api-key">
              <svg id="key-visibility-icon" aria-hidden="true" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" viewBox="0 0 24 24">
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            </button>
          </div>
          <p class="hint" id="api-key-hint">在服务器上执行 zhiyu-api-key 签发，明文只显示一次。</p>
        </div>

        <div class="notice warning" id="credential-warning" hidden></div>
        <div class="notice" id="save-result" hidden></div>

        <button class="submit" id="save-button" type="submit">测试连接并保存</button>
      </form>

      <section class="card status-card" aria-labelledby="status-heading">
        <div class="card-head">
          <h2 id="status-heading">备份拉取</h2>
        </div>
        <dl class="status-list">
          <div class="status-row">
            <dt>最近拉取</dt>
            <dd class="is-empty" id="last-pull">尚未拉取</dd>
          </div>
          <div class="status-row">
            <dt>本地快照</dt>
            <dd id="snapshot-count">0</dd>
          </div>
          <div class="status-row">
            <dt>上次失败</dt>
            <dd class="is-empty" id="last-error">无</dd>
          </div>
        </dl>
      </section>
      </div>
    </main>
  </body>
</html>
